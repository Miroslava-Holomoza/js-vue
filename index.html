<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Паливозаправник</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: rgba(17, 24, 39, 0.8);
        --line: #334155;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --blue: #38bdf8;
        --fuel: #f59e0b;
        --fuel-dark: #b45309;
        --green: #22c55e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020817, #0f172a, #111827);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .app {
        width: min(960px, 92vw);
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 20px;
        padding: 30px 28px 20px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.7);
      }

      h1 {
        margin: 0 0 10px;
        text-align: center;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin: 0 0 28px;
        text-align: center;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      .scene {
        position: relative;
        height: 440px;
        border-radius: 18px;
        background:
          linear-gradient(to bottom, rgba(59,130,246,0.1), rgba(15,23,42,0.2)),
          linear-gradient(to right, rgba(148,163,184,0.05), rgba(148,163,184,0.1));
        border: 1px solid rgba(148, 163, 184, 0.15);
        overflow: hidden;
      }

      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 90px;
        background: linear-gradient(to top, rgba(34,197,94,0.18), rgba(52,211,153,0.02));
        border-top: 1px solid rgba(34,197,94,0.24);
      }

      .truck {
        position: absolute;
        left: 50%;
        bottom: 80px;
        width: 560px;
        height: 270px;
        transform: translateX(-50%);
      }

      .cab {
        position: absolute;
        left: 20px;
        top: 100px;
        width: 160px;
        height: 100px;
        background: linear-gradient(145deg, #e2e8f0, #94a3b8);
        border: 4px solid #475569;
        border-radius: 18px 24px 18px 20px;
        box-shadow: inset 0 0 0 4px rgba(15,23,42,0.15);
      }

      .cab::before {
        content: "";
        position: absolute;
        left: 22px;
        top: -28px;
        width: 90px;
        height: 32px;
        background: linear-gradient(180deg, #cbd5e1, #94a3b8);
        border: 4px solid #475569;
        border-bottom: none;
        border-radius: 18px 18px 0 0;
      }

      .window {
        position: absolute;
        right: 18px;
        top: 18px;
        width: 60px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, #dbeafe, #93c5fd);
        border: 3px solid #475569;
      }

      .cargo {
        position: absolute;
        left: 170px;
        top: 72px;
        width: 260px;
        height: 150px;
        background: linear-gradient(180deg, #cbd5e1, #94a3b8);
        border: 4px solid #475569;
        border-radius: 16px 20px 16px 16px;
        overflow: hidden;
      }

      .tank-shell {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(226,232,240,0.8), rgba(148,163,184,0.4));
      }

      .liquid {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        height: 52%;
        background: linear-gradient(180deg, var(--fuel), var(--fuel-dark));
        border-radius: 12px 12px 8px 8px;
        box-shadow: inset 0 0 18px rgba(255,255,255,0.18);
        transition: height 0.8s ease;
      }

      .liquid::after {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0));
      }

      .tank-label {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 10px;
        font-size: 13px;
        font-weight: bold;
        color: #1f2937;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .tank-stripe {
        position: absolute;
        left: 15px;
        right: 15px;
        top: 44px;
        height: 10px;
        background: linear-gradient(90deg, rgba(255,255,255,0.5), rgba(15,23,42,0.08), rgba(255,255,255,0.45));
        border-radius: 10px;
      }

      .nozzle {
        position: absolute;
        right: -88px;
        top: 148px;
        width: 100px;
        height: 12px;
        background: linear-gradient(90deg, #e2e8f0, #94a3b8);
        border: 3px solid #475569;
        border-radius: 10px;
        transform-origin: left center;
        animation: nozzlePulse 1.5s ease-in-out infinite alternate;
      }

      .nozzle::after {
        content: "";
        position: absolute;
        right: -18px;
        top: -7px;
        width: 24px;
        height: 20px;
        background: linear-gradient(180deg, #cbd5e1, #94a3b8);
        border: 3px solid #475569;
        border-radius: 8px;
      }

      .wheel {
        position: absolute;
        bottom: -28px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: radial-gradient(circle at center, #cbd5e1 0 20%, #475569 20% 50%, #1f2937 52% 100%);
        border: 4px solid #1f2937;
      }

      .wheel.front { left: 50px; }
      .wheel.mid { left: 210px; }
      .wheel.back { left: 390px; }

      .controls {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 20px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      #fillBtn {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        box-shadow: 0 10px 28px rgba(34,197,94,0.34);
      }

      #drainBtn {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        box-shadow: 0 10px 28px rgba(245,158,11,0.28);
      }

      .stats {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        gap: 24px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 1rem;
      }

      .badge {
        background: rgba(148,163,184,0.07);
        border: 1px solid rgba(148,163,184,0.15);
        padding: 10px 16px;
        border-radius: 999px;
      }

      @keyframes nozzlePulse {
        0% { transform: scaleX(1); opacity: 0.7; }
        100% { transform: scaleX(1.08); opacity: 1; }
      }

      @media (max-width: 700px) {
        .truck {
          transform: translateX(-50%) scale(0.8);
          transform-origin: center bottom;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Паливозаправник</h1>
      <p class="subtitle">Візуалізація резервуара та рівня пального</p>

      <div class="scene">
        <div class="ground"></div>

        <div class="truck">
          <div class="cab">
            <div class="window"></div>
          </div>

          <div class="cargo">
            <div class="tank-shell"></div>
            <div class="tank-label">Fuel</div>
            <div class="tank-stripe"></div>
            <div class="liquid" id="liquid"></div>
          </div>

          <div class="nozzle" id="nozzle"></div>

          <div class="wheel front"></div>
          <div class="wheel mid"></div>
          <div class="wheel back"></div>
        </div>
      </div>

      <div class="controls">
        <button id="fillBtn" type="button">Заправити</button>
        <button id="drainBtn" type="button">Спустити</button>
      </div>

      <div class="stats">
        <div class="badge">Рівень: <strong id="levelText">35%</strong></div>
        <div class="badge">Об’єм: <strong id="volumeText">1,050 л</strong></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
